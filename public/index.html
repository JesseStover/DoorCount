<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23007aff%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27700%27%3E%2B1%3C/text%3E%3C/svg%3E">
<title>Door Count</title>
<style>
/* Layout: bouncer sees one station (big buttons) plus live totals. Manager gets the full house with a tab bar. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:#e5e5ea; --fill2:#d1d1d6;
  --fg:#000000; --mut:#6c6c70; --sep:rgba(60,60,67,.18);
  --blue:#007aff; --blue-ink:#ffffff; --blue-soft:rgba(0,122,255,.12);
  --green:#34c759; --orange:#c76e00; --red:#ff3b30; --path:#8e3fc4; --path-soft:rgba(142,63,196,.13);
  --warn-soft:rgba(255,149,0,.16); --crit-soft:rgba(255,59,48,.14);
  --glass:rgba(249,249,251,.82); --segon:#ffffff;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#3a3a3c;
    --fg:#ffffff; --mut:#98989f; --sep:rgba(84,84,88,.65);
    --blue:#0a84ff; --blue-soft:rgba(10,132,255,.22);
    --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --path:#bf5af2; --path-soft:rgba(191,90,242,.22);
    --warn-soft:rgba(255,159,10,.2); --crit-soft:rgba(255,69,58,.22);
    --glass:rgba(28,28,30,.8); --segon:#636366;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#3a3a3c;
  --fg:#ffffff; --mut:#98989f; --sep:rgba(84,84,88,.65);
  --blue:#0a84ff; --blue-soft:rgba(10,132,255,.22);
  --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --path:#bf5af2; --path-soft:rgba(191,90,242,.22);
  --warn-soft:rgba(255,159,10,.2); --crit-soft:rgba(255,69,58,.22);
  --glass:rgba(28,28,30,.8); --segon:#636366;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.38 var(--ui);-webkit-font-smoothing:antialiased;
  padding-top:max(10px,env(safe-area-inset-top,0px));
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body.mgr{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.app{max-width:560px;margin-inline:auto;display:grid;gap:14px}
#main{display:grid;gap:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue-soft);outline-offset:1px}
button:disabled{cursor:not-allowed}
[hidden]{display:none!important}

.nav{display:grid;gap:2px;padding-top:4px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
.eyebrow{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navr{display:flex;align-items:center;gap:12px;flex:none}
.nav h1{margin:0;font:700 34px/1.06 var(--ui);letter-spacing:-.025em;text-wrap:balance;overflow-wrap:anywhere}
.sub{margin:0;color:var(--mut);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.live i{background:var(--green)}
.pill.err i{background:var(--red)}
.link{background:none;border:0;padding:0;color:var(--blue);font-size:inherit;font-weight:500}
.nav .link{font-size:15px}
.navr .link{font-size:13px;font-weight:600}

.card{background:var(--card);border-radius:22px;padding:16px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.hero{display:grid;gap:12px}
.herorow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.num{font:700 68px/.95 var(--round);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.of{color:var(--mut);font-size:15px;padding-bottom:6px}
.of b{color:var(--fg);font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--green);border-radius:3px;transition:width .3s}
.meter.near i{background:var(--orange)}
.meter.full i{background:var(--red)}
.alert{padding:11px 14px;border-radius:14px;font-weight:600;font-size:15px}
.alert.warn{background:var(--warn-soft);color:var(--orange)}
.alert.crit{background:var(--crit-soft);color:var(--red)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:18px;padding:12px 6px}
.stat{text-align:center;padding:0 4px}
.stat span{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.stat b{font:700 24px/1.2 var(--round);font-variant-numeric:tabular-nums}

.list,.kv,.board{list-style:none;margin:0;padding:0;background:var(--card);border-radius:18px;overflow:hidden}
.board li,.kv li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:.5px solid var(--sep);font-size:17px}
.board li:first-child,.kv li:first-child{border-top:0}
.board li.me{background:var(--blue-soft)}
.board li b,.kv b{font-variant-numeric:tabular-nums;font-weight:600}
.board li b small{color:var(--mut);font-weight:400;font-size:14px}
.board li.near b{color:var(--orange)}
.board li.full b{color:var(--red)}
.kv li>span{min-width:0;overflow-wrap:anywhere}
.kv small{display:block;margin-top:2px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.hist li{display:grid;gap:6px}
.hist .hb{display:block;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.hist .hb i{display:block;height:100%;background:var(--blue)}

.seg{display:flex;gap:2px;background:var(--fill);border-radius:12px;padding:2px}
.chip{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;font:600 17px/1 var(--round);font-variant-numeric:tabular-nums;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04)}
.mgr .seg{position:sticky;top:max(8px,env(safe-area-inset-top,0px));z-index:6;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sides{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
.side{background:var(--card);border-radius:22px;padding:14px 8px;text-align:center;display:grid;gap:2px}
.side .sl{font-size:13px;font-weight:600;color:var(--mut);overflow-wrap:anywhere}
.side b{font:700 44px/1.05 var(--round);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.side small{font-size:13px;color:var(--mut)}
.side.out b{color:var(--fill2)}
.side.near b{color:var(--orange)}
.side.full b{color:var(--red)}
.gate{border-radius:30px;padding:26px 20px;text-align:center;display:grid;gap:6px;color:#fff}
.gate.ok{background:var(--green)}
.gate.stop{background:var(--red)}
.gate .gs{font:700 46px/1.05 var(--round);letter-spacing:-.025em}
.gate .gm{font-size:18px;font-weight:600;opacity:.95}
body.mgr{background:#0e1512;color:#fff}
body.mgr .hero,body.mgr .stats{background:rgba(255,255,255,.08);color:#fff}
body.mgr .lbl,body.mgr .of,body.mgr .stat span,body.mgr .eyebrow,body.mgr .sub,body.mgr .seghint,body.mgr .pill,body.mgr h3{color:rgba(255,255,255,.68)}
body.mgr .of b{color:#fff}
body.mgr .hero .meter{background:rgba(255,255,255,.18)}
body.mgr .seg{background:rgba(255,255,255,.14)}body.mgr .chip{color:#fff}body.mgr .chip[aria-pressed="true"]{background:#fff;color:#000}
body.mgr .alert.warn{background:#f5a300;color:#241700}body.mgr .alert.crit{background:#e5322d;color:#fff}
body.mgr .acard{background:#12b45a;color:#fff;box-shadow:none}
body.mgr .acard.near{background:#f5a300;color:#241700;box-shadow:none}
body.mgr .acard.full{background:#e5322d;color:#fff;box-shadow:none}
body.mgr .acard .acap,body.mgr .acard .flow,body.mgr .acard.near .acap,body.mgr .acard.full .acap{color:inherit;opacity:.92}
body.mgr .acard .meter{background:rgba(0,0,0,.22)}body.mgr .acard .meter i,body.mgr .acard.full .meter i{background:#fff}body.mgr .acard.near .meter i{background:#241700}
body.mgr .acard .btn{background:rgba(0,0,0,.22);color:inherit}
body.mgr .acard .btn.primary{background:#fff;color:#0a6b35}
body.mgr .acard.near .btn.primary{background:#241700;color:#ffc94d}
body.mgr .acard.full .btn.primary{background:rgba(0,0,0,.3);color:#ffd0cd}
body.mgr .acard .link{color:inherit;text-decoration:underline}
body.mgr .list,body.mgr .kv,body.mgr .board,body.mgr .tbtn{color:var(--fg)}
#sheet{color:var(--fg)}
body.mgr .tabbar{background:rgba(24,30,27,.86);border-color:rgba(255,255,255,.12)}body.mgr .tabbar button{color:rgba(255,255,255,.72)}body.mgr .tabbar button.on{color:#fff}
body.stn{min-height:100vh;transition:background .25s}
body.stn[data-sig=ok]{background:#12b45a;color:#fff}
body.stn[data-sig=near]{background:#f5a300;color:#241700}
body.stn[data-sig=stop]{background:#e5322d;color:#fff}
body.stn[data-sig=multi]{background:#2a1566;color:#fff}
body.stn[data-sig=multi][data-kind=door]{background:#14246b}
body.stn .eyebrow,body.stn .pill,body.stn .sub{color:inherit;opacity:.9}
body.stn .link{color:inherit;text-decoration:underline;font-weight:700}
body.stn .pill i{background:currentColor}
body.stn .nav h1{font-size:28px;font-weight:800}
body.stn #night{margin:6px -16px 0;padding:8px 16px;font:900 13px var(--ui);letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.28);color:inherit}
body.stn[data-kind=path] #night{background:#4a1fa8;color:#fff}
body.stn[data-sig=multi][data-kind=door] #night{background:#1642d6;color:#fff}
body.stn .gate{background:none;border-radius:0;padding:8px 0 0;min-height:44vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;color:inherit}
body.stn .gate.ok,body.stn .gate.stop,body.stn .gate.near{background:none}
body.stn .gate .gs{font:900 min(50vw,230px)/.9 var(--round);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
body.stn .gate .gs.w{font-size:min(30vw,128px);letter-spacing:-.03em}
body.stn .gate .gm{font-size:30px;font-weight:800;opacity:1}
body.stn .gate .gx{font-size:17px;opacity:.9}
body.stn .sides{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:15px}
body.stn .side{background:none;padding:0;border-radius:0;display:flex;gap:6px}
body.stn .side .sl,body.stn .side b{font:700 15px var(--ui);color:inherit;letter-spacing:0}
body.stn .side small{display:none}
body.stn .bigrow{grid-template-columns:1fr 2fr}
body.stn .bigrow.one{grid-template-columns:1fr}
body.stn .bigbtn{border-radius:30px;font-weight:900}
body.stn .bigrow .bigbtn{min-height:140px;font-size:38px}
body.stn .bigrow.one .bigbtn{min-height:min(36vh,280px);font-size:48px}
body.stn[data-sig=ok] .bigbtn.in{background:#fff;color:#0a6b35}
body.stn[data-sig=ok] .bigbtn.out{background:rgba(0,0,0,.22);color:#fff}
body.stn[data-sig=near] .bigbtn.in{background:#241700;color:#ffc94d}
body.stn[data-sig=near] .bigbtn.out{background:rgba(0,0,0,.15);color:#241700}
body.stn[data-sig=stop] .bigbtn.in{background:rgba(0,0,0,.28);color:#ffb4b0}
body.stn[data-sig=stop] .bigbtn.out{background:#fff;color:#a01410}
body.stn .bigbtn.pass{align-items:flex-start;text-align:left;justify-content:center;gap:2px;padding:16px 20px;min-height:150px;font-size:21px;color:#fff}
body.stn .bigbtn.pass .bn{font:900 80px/1 var(--round);letter-spacing:-.04em}
body.stn .bigbtn.pass small{font-size:16px;font-weight:700;opacity:.95}
body.stn .bigbtn.pass.sg-ok{background:#12b45a}
body.stn .bigbtn.pass.sg-near{background:#f5a300;color:#241700}
body.stn .bigbtn.pass.sg-stop{background:#e5322d}
body.stn .bigbtn.pass.sg-out{background:rgba(255,255,255,.18)}
body.stn .bigbtn.pass:disabled{opacity:.5}
body.stn[data-sig=multi] #bigs:has(.pass:nth-child(3)){grid-template-columns:1fr 1fr}
body.stn[data-sig=multi] #bigs:has(.pass:nth-child(3)) .pass .bn{font-size:54px}
body.stn[data-sig=multi] #bigs:has(.pass:nth-child(3)) .pass{font-size:17px;padding:12px 14px}
body.stn .textbtn{color:inherit;opacity:.9}
body.stn[data-sig=multi] #bigs{min-height:62vh;grid-auto-rows:1fr}
.bigbtn.in.over{background:var(--red)}
.bigbtn.mv.full,.bigbtn.pass.full{background:var(--crit-soft);color:var(--red)}
.btn.full{color:var(--red)}
.btn.over{background:var(--red);color:#fff}
.seghint{margin:-6px 4px 0;font-size:12px;color:var(--mut)}

.bigs{display:grid;gap:12px}
.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigrow.one{grid-template-columns:1fr}
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;border-radius:28px;min-height:190px;padding:14px;text-align:center;font:700 52px/1 var(--round);letter-spacing:-.02em;transition:transform .12s,opacity .15s}
.bigbtn.in{background:var(--blue);color:var(--blue-ink)}
.bigbtn.out{background:var(--fill);color:var(--blue)}
.bigbtn.mv,.bigbtn.pass{background:var(--blue-soft);color:var(--blue);min-height:112px;font-size:27px;line-height:1.1}
.bigbtn.pass{min-height:132px}
.bigbtn .bl i{font-style:normal;opacity:.65}
.bigbtn small{font:500 14px/1.2 var(--ui);letter-spacing:0;opacity:.8}
.bigrow.one .bigbtn{min-height:min(40vh,320px);font-size:64px}
.bigbtn:disabled{opacity:.35}
.bigbtn:active:not(:disabled){transform:scale(.97)}
.textbtn{display:block;width:100%;background:none;border:0;padding:12px;color:var(--blue);font-weight:600;font-size:17px}
.textbtn:disabled{color:var(--mut);opacity:.6}

#cards{display:grid;gap:12px}
.acard{display:grid;gap:12px}
.acard.near{box-shadow:inset 0 0 0 2px var(--orange)}
.acard.full{box-shadow:inset 0 0 0 2px var(--red)}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ctop>div:first-child{min-width:0}
.aname{margin:0;font:700 22px/1.15 var(--ui);letter-spacing:-.015em;overflow-wrap:anywhere}
.acap{margin:3px 0 0;font-size:14px;color:var(--mut)}
.acard.near .acap{color:var(--orange)}
.acard.full .acap{color:var(--red)}
.flow{margin:2px 0 0;font-size:13px;color:var(--mut)}
.count{font:700 52px/.95 var(--round);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count.neg{color:var(--red)}
.btns{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.btns.dl{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.btn{min-height:50px;border-radius:14px;border:0;background:var(--fill);color:var(--blue);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;padding:8px 14px}
.btn.primary{background:var(--blue);color:var(--blue-ink)}
.btn small{display:block;font-size:12px;font-weight:500;opacity:.8}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.big{min-height:56px;font-size:18px}
.btn.danger{color:var(--red)}

h3{margin:6px 4px 0;font:600 13px/1.2 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tbtn{min-height:70px;border-radius:18px;border:0;background:var(--card);padding:10px 12px;display:grid;gap:2px;text-align:left}
.tbtn span{font-size:12px;color:var(--mut)}
.tbtn b{font:700 26px/1 var(--round);font-variant-numeric:tabular-nums}
.tbtn:active{transform:scale(.97)}
.feedhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.undo{border:0;background:var(--fill);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--blue);max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo:disabled{opacity:.4}
#feed{list-style:none;margin:8px 0 0;padding:0;background:var(--card);border-radius:18px;overflow:hidden}
#feed li{display:grid;grid-template-columns:64px 1fr auto;gap:8px;padding:11px 14px;border-top:.5px solid var(--sep);font-size:15px}
#feed li:first-child{border-top:0}
#feed .t{color:var(--mut);font-variant-numeric:tabular-nums}
#feed .d{min-width:0;overflow-wrap:anywhere}
#feed .w{color:var(--mut);font-size:13px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#feed li.empty{display:block;color:var(--mut)}

.state{background:var(--card);border-radius:24px;padding:24px 20px;display:grid;gap:12px;margin-top:8px}
.state h2{margin:0;font:700 26px/1.1 var(--ui);letter-spacing:-.02em}
.state p{margin:0;color:var(--mut)}
.posts{display:grid;gap:8px}
.posts .btn{min-height:58px;text-align:left;font-size:18px}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100% - 24px));z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:28px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 8px 30px rgba(0,0,0,.16),0 0 0 .5px var(--sep)}
.tabbar button{background:none;border:0;border-radius:22px;padding:7px 2px 6px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut)}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--blue);background:var(--blue-soft)}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.38);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center}
.panel{position:relative;width:100%;max-width:600px;max-height:93%;overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:26px 16px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.panel::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--fill2)}
.panel h2{margin:6px 0 0;font:700 28px/1.1 var(--ui);letter-spacing:-.02em}
.panel h3{margin-top:10px}
.note{margin:0;font-size:14px;color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:120px}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--blue)}
.chart .pk{fill:var(--orange)}
.chart .ax{stroke:var(--sep);stroke-width:1}
.chart text{fill:var(--mut);font-size:9px;font-family:var(--ui)}

/* walkthrough */
.sheet.full .panel{height:94%;max-height:94%;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.wnav{display:flex;justify-content:space-between;align-items:center;padding-top:6px;font-size:15px}

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var memLS={};
  var lsGet=function(k){var v=null;try{v=localStorage.getItem(k)}catch(e){}return v!=null?v:(memLS[k]!=null?memLS[k]:null)};
  var lsSet=function(k,v){if(v==null)delete memLS[k];else memLS[k]=String(v);try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}};
  var TL={id:'ID checked',turned:'Turned away',band:'Wristbands'};

  var store=null,user=null,uid=null,canCfg=false,urlV=null,urlS=null,urlP=null,curCtx=null,peek=null,pendingWrites=false,authReady=false,cfgLoaded=false;
  var venErr=false,venTimer=null,rawCfg=null,myVenues=null,vid=null,cfg=null,events=[],unsubVenue=null,unsubMy=null,subVid=null;
  var lastSig='',group=1,moveFrom=null,station=null,locked=false,tab='live',W=null;
  var status='connecting',slow=false,unsubEv=null,subNight=null,sig='',toastT=null,lastHead='',lastMove='';
  var alertLv={},alertInit=false,soundOn=true,actx=null;
  function rid(n){var a=new Uint8Array(n),o='',c='abcdefghijkmnpqrstuvwxyz23456789';try{crypto.getRandomValues(a)}catch(e){for(var i=0;i<n;i++)a[i]=Math.floor(Math.random()*256)}for(var j=0;j<n;j++)o+=c[a[j]%c.length];return o}

  /* ---------- storage: Firebase (Firestore + Auth), loaded from Google's CDN ---------- */
  var FB_VER='10.12.2';
  async function makeFirebaseStore(){
    var conf=null;
    try{var r=await fetch('/__/firebase/init.json',{cache:'no-store'});if(r.ok)conf=await r.json()}catch(e){}
    if(!conf&&window.FIREBASE_CONFIG)conf=window.FIREBASE_CONFIG;
    if(!conf||!conf.projectId)throw {code:'noconfig'};
    var base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    var A=await import(base+'firebase-app.js'),Au=await import(base+'firebase-auth.js'),F=await import(base+'firebase-firestore.js');
    var app=A.initializeApp(conf),auth=Au.getAuth(app),fs;
    try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
    catch(e){fs=F.getFirestore(app)}
    var vref=function(v){return F.doc(fs,'venues',v)};
    var S={
      onUser:function(cb){return Au.onAuthStateChanged(auth,function(u){cb(u?{uid:u.uid,email:u.email||'',name:u.displayName||''}:null)})},
      google:function(){return Au.signInWithPopup(auth,new Au.GoogleAuthProvider())},
      signOut:function(){return Au.signOut(auth)},
      myVenues:function(uid,cb,err){return F.onSnapshot(F.query(F.collection(fs,'venues'),F.where('owner','==',uid)),{includeMetadataChanges:true},function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data())}),{cache:s.metadata.fromCache})},err)},
      allVenues:function(cb,err){return F.onSnapshot(F.collection(fs,'venues'),function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data())}))},err)},
      watchVenue:function(v,cb,err){return F.onSnapshot(vref(v),function(d){cb(d.exists()?Object.assign({id:d.id},d.data()):null)},err)},
      watchEvents:function(v,night,cb,err){
        return F.onSnapshot(F.query(F.collection(fs,'venues',v,'events'),F.where('night','==',night)),{includeMetadataChanges:true},function(s){
          cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data())}),{pending:s.metadata.hasPendingWrites,cache:s.metadata.fromCache});
        },err);
      },
      saveVenue:function(v,data){return F.setDoc(vref(v),data)},
      addEvent:function(v,e){var b={};Object.keys(e).forEach(function(k){if(k!=='id')b[k]=e[k]});return F.setDoc(F.doc(fs,'venues',v,'events',e.id),b)},
      delEvent:function(v,id){return F.deleteDoc(F.doc(fs,'venues',v,'events',id))},
      saveNight:function(v,id,sum){return F.setDoc(F.doc(fs,'venues',v,'nights',id),sum)},
      listNights:function(v){return F.getDocs(F.collection(fs,'venues',v,'nights')).then(function(s){return s.docs.map(function(d){return d.data()})})},
      deleteVenue:async function(v){
        var cols=['events','nights'];
        for(var c=0;c<cols.length;c++){
          var snap=await F.getDocs(F.collection(fs,'venues',v,cols[c])),ds=snap.docs;
          for(var i=0;i<ds.length;i+=400){var b=F.writeBatch(fs);ds.slice(i,i+400).forEach(function(d){b.delete(d.ref)});await b.commit()}
        }
        await F.deleteDoc(vref(v));
      },
      clearEvents:async function(v,ids){
        for(var i=0;i<ids.length;i+=400){
          var b=F.writeBatch(fs);ids.slice(i,i+400).forEach(function(id){b.delete(F.doc(fs,'venues',v,'events',id))});
          await b.commit();
        }
      }
    };
    return S;
  }

  function fmtT(ts){return ts?new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''}
  function fmtDT(ts){return ts?new Date(ts).toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}
  function fmtH(ts){return new Date(ts).toLocaleTimeString([], {hour:'numeric'})}
  function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3600)}
  function newId(p){return (p||'a')+rid(6)}
  function areaOf(id){return ((cfg&&cfg.areas)||[]).filter(function(x){return x.id===id})[0]}
  function canMove(f,t){var a=areaOf(f);return !!a&&f!==t&&(a.noMove||[]).indexOf(t)<0&&!!areaOf(t)}
  function moveOk(dr,id){if(!dr||!Array.isArray(dr.moveTo))return true;var mp=(cfg&&cfg.__map)||{};return dr.moveTo.some(function(x){return (mp[x]||x)===id})}
  function hasDest(f){return ((cfg&&cfg.areas)||[]).some(function(b){return canMove(f,b.id)})}
  function byOrder(list,order,idOf){
    if(!Array.isArray(order)||!order.length)return list;
    var pos={};order.forEach(function(id,i){pos[id]=i});
    return list.map(function(x,i){return {x:x,i:i}}).sort(function(a,b){
      var pa=pos[idOf(a.x)],pb=pos[idOf(b.x)];
      if(pa===undefined&&pb===undefined)return a.i-b.i;
      if(pa===undefined)return 1;if(pb===undefined)return -1;return pa-pb}).map(function(o){return o.x})}
  function stations(c){
    var out=[];
    ((c&&c.areas)||[]).forEach(function(a){
      var ds=a.doors||[];
      if(ds.length)ds.forEach(function(d){out.push({id:d.id,label:a.name+': '+d.name,k:'door'})});
      else if(a.roam!==false)out.push({id:a.id,label:a.name,k:'door'});
    });
    ((c&&c.passages)||[]).forEach(function(x){out.push({id:x.id,label:x.name,k:((x.links||[]).some(function(l){return l.a==='out'||l.b==='out'})?'door':'path')})});
    return byOrder(out,c&&c.postOrder,function(x){return x.id});
  }

    var W=320,H=132,pl=28,pb=20,pt=10,max=Math.max.apply(null,hours.map(function(h){return h.peak}))||1;

    var o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Most people inside in each hour">';

      Q('How do I fix a wrong number?','<b>Design</b>, then <b>Edit counts</b>. Fix the number, then tap <b>Done editing</b>.')+
      Q('How do I start over with a fresh venue?','<b>Design</b>, then <b>Delete this venue</b>. You have to type its name to confirm. Everything in it is removed for good, so use <b>Save this design to a file</b> first if you want the layout back. Then add a new venue.')+
      Q('How do I start a new night or see the report?','<b>Design</b>, then <b>Tonight\u2019s report and new night</b>. The <b>Nights</b> tab lists past nights.')+
      '<h3 class="qh">Other</h3>'+
      '')+(onlyB?'':'')+
      (onlyB?'':Q('The page looks old after an update','Force a fresh load. On a computer press Ctrl+Shift+R. On a phone close the tab and open the link again, or open it in a private tab.'))+
      '<div class="acts"><button class="btn primary" data-act="close">Done</button></div>');
  }
  function openQr(kind,id){
    setTab('stations');
    var sts=stations(cfg),crew=crewList();
    var badge=function(k){return '<em class="kt">'+(k==='path'?'Path':'Door')+'</em>'};
    if(kind==='st'){
      var x=sts.filter(function(y){return y.id===id})[0];if(!x){openQr();return}
      openSheet('<h2>'+esc(x.label)+'</h2><div class="qrbig kd-'+x.k+'">'+badge(x.k)+qrSvg(stationLink(x.id))+'<p>Scan with the phone camera</p></div><div class="acts"><button class="btn" data-act="sharelink" data-a="'+esc(x.id)+'">Send link</button><button class="btn" data-act="post" data-a="'+esc(x.id)+'">Count it myself</button><button class="btn primary" data-act="qrpage">Back</button></div>');return}
    if(kind==='crew'){
      var c=crew.filter(function(y){return y.id===id})[0];if(!c){openQr();return}
      var ls=crewLinks(c);
      openSheet('<h2>'+esc(c.name)+'</h2>'+(ls.length?'<div class="qrbig">'+qrSvg(pLink(c))+'<p>Scan with the phone camera. It shows: '+ls.map(function(x){return esc(x.label)}).join(', ')+'.</p></div>':'<p class="note">No doors or paths ticked for '+esc(c.name)+' yet. Use Manage staff to tick some.</p>')+
        (ls.length?'<p class="note">Need to cover for '+esc(c.name)+'?</p><div class="qlist">'+ls.map(function(x){return '<button class="qrow kd-'+x.k+'" data-act="post" data-a="'+esc(x.id)+'"><b>Take over: '+esc(x.label)+'</b></button>'}).join('')+'</div>':'')+'<div class="acts">'+(ls.length?'<button class="btn" data-act="crewsend" data-c="'+esc(c.id)+'">Send link</button>':'')+'<button class="btn primary" data-act="qrpage">Back</button></div>');return}
    openSheet('<h2>QR codes</h2><p class="note">Tap a person, or a door or path, to show its QR code.</p>'+
      (crew.length?'<h3 class="qh">People</h3><div class="qlist">'+crew.map(function(c){var n=crewLinks(c).length;return '<button class="qrow" data-act="qrshow" data-k="crew" data-a="'+esc(c.id)+'"><b>'+esc(c.name)+'</b><small>'+n+(n===1?' code':' codes')+'</small></button>'}).join('')+'</div>':'')+
      (sts.length?'<h3 class="qh">Doors and paths</h3><div class="qlist">'+sts.map(function(x){return '<button class="qrow kd-'+x.k+'" data-act="qrshow" data-k="st" data-a="'+esc(x.id)+'">'+badge(x.k)+'<b>'+esc(x.label)+'</b></button>'}).join('')+'</div>':'<p class="note">No posts yet. Use Design to add some.</p>')+
      '<div class="acts"><button class="btn" data-act="stations">Manage staff</button><button class="btn primary" data-act="close">Done</button></div>');
  }
  function openStations(){
    setTab('stations');
    var sts=stations(cfg);
    var crew=crewList(),have={};
    crew.forEach(function(c){(c.posts||[]).forEach(function(p){have[p]=1})});
    var lone=sts.filter(function(x){return !have[x.id]});
    var all=sts.map(function(x){
      var open=qrOpen===x.id;
      return '<div class="lrow kd-'+x.k+'"><div class="lh"><span class="kt">'+(x.k==='path'?'Path':'Door')+'</span><b class="ln">'+esc(x.label)+'</b><button class="link" data-act="post" data-a="'+esc(x.id)+'">Preview</button></div><div class="lb"><button class="btn" data-act="sharelink" data-a="'+esc(x.id)+'">Send link</button></div>'+
        '<div class="qrbox">'+qrSvg(stationLink(x.id))+'<p>Scan with the phone camera</p></div></div>'}).join('');
    openSheet('<h2>Staff &amp; links</h2><p class="note">Add each person and tick the doors and paths they work. Each person gets one QR code and one link that shows only their posts. Their name is filled in for them.</p>'+
      (crew.length?crew.map(function(c){
        var n=crewLinks(c).length;
        return '<div class="lrow crew"><div class="lh"><b class="ln">'+esc(c.name)+'</b><button class="link" data-act="crewrm" data-c="'+esc(c.id)+'">Remove</button></div><div class="chks">'+
          sts.map(function(x){return '<label class="chk kd-'+x.k+'"><input type="checkbox" data-act="crewtog" data-c="'+esc(c.id)+'" data-s="'+esc(x.id)+'"'+((c.posts||[]).indexOf(x.id)>=0?' checked':'')+'><span><em class="kt">'+(x.k==='path'?'Path':'Door')+'</em>'+esc(x.label)+'</span></label>'}).join('')+'</div>'+
          '<div class="pqr" data-c="'+esc(c.id)+'">'+pqr(c)+'</div>'+
          '<button class="btn primary" data-act="crewsend" data-c="'+esc(c.id)+'"'+(n?'':' disabled')+'>Send '+esc(c.name)+'’s link</button></div>'}).join(''):'<p class="note">No staff yet. Add a name below.</p>')+
      '<div class="addcrew"><input id="newcrew" type="text" maxlength="24" placeholder="Staff name" autocomplete="off"><button class="btn primary" data-act="crewadd">Add</button></div>'+
      (crew.length>1?'<button class="btn primary big" data-act="crewall">Send everyone their link</button>':'')+
      (crew.length&&lone.length?'<p class="note warnnote">Nobody is assigned to: '+lone.map(function(x){return esc(x.label)}).join(', ')+'</p>':'')+
      (sts.length?'<details class="lall"><summary>All posts (links and QR codes)</summary><div class="lnks">'+all+'</div></details>':'<p class="note">No posts yet. Use Design to add some.</p>')+
      '<button class="textbtn" data-act="takeover">Count a post myself</button>'+
      '<div class="acts"><button class="btn" data-act="close">Done</button></div>');
  }
  async function shareText(title,text,url){
    try{if(navigator.share){await navigator.share(url?{title:title,text:text,url:url}:{title:title,text:text});return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(url||text);toast(url?'Link copied':'Links copied')}catch(e){window.prompt('Copy this',url||text)}
  }
  async function shareAll(){
    var v=(cfg.venue||'Door Count');
    var t=v+' - your door links:\n\n'+stations(cfg).map(function(x){return x.label+':\n'+stationLink(x.id)}).join('\n\n');
    shareText(v,t,null);
  }
  async function shareLink(id){
    var url=stationLink(id),lab=(stations(cfg).filter(function(x){return x.id===id})[0]||{}).label||'station';
    try{if(navigator.share){await navigator.share({title:(cfg.venue||'Door Count')+': '+lab,url:url});return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){window.prompt('Copy this link',url)}
  }
  var signinMsg='';
  async function doAuth(){
    signinMsg='';
    try{await store.google()}
    catch(e){
      var c=(e&&e.code)||'';
      signinMsg=c.indexOf('operation-not-allowed')>=0||c.indexOf('configuration-not-found')>=0?'Google sign-in is not turned on yet. In the Firebase console open Authentication, then Sign-in method, and enable Google.':c.indexOf('popup-closed')>=0||c.indexOf('cancelled')>=0?'The Google window was closed. Try again.':c.indexOf('popup-blocked')>=0?'Your browser blocked the Google window. Allow pop-ups for this page and try again.':'Could not sign in. Check your connection and try again.';
      var el=$('#a-err');if(el)el.textContent=signinMsg;else render();
    }
  }

  document.addEventListener('focusin',function(ev){var t=ev.target;if(t&&t.tagName==='INPUT'&&t.type==='number'){try{t.select()}catch(e){}setTimeout(function(){try{t.select()}catch(e){}},30)}});
  document.addEventListener('click',function(ev){
    unlockAudio();
    var b=ev.target.closest('[data-act]');
    if(!b){if(ev.target.id==='sheet'&&!W)closeSheet();return}
    if(b.disabled)return;
    curCtx=(b.dataset.door!==undefined||b.dataset.via!==undefined)?{door:b.dataset.door,via:b.dataset.via}:null;
    var act=b.dataset.act,id=b.dataset.a;
    if(act.indexOf('w-')===0&&W){wizAct(act,b);return}
    if(act==='g'){group=+b.dataset.g;paint();return}
    if(act==='close'){closeSheet();return}
    if(act==='live'){closeSheet();return}
    if(act==='sound'){soundOn=!soundOn;lsSet('dc-sound',soundOn?'1':'0');updatePill();if(soundOn)beep();return}
    if(act==='retryven'){venErr=false;startMyVenues();render();return}
    if(act==='design-new'){closeSheet();openWizard(true);return}
    if(act==='design-edit'){closeSheet();openWizard(false);return}
    if(act==='allv'){openAll(false);return}
    if(act==='alladm'){openAll(true);return}
    if(act==='allgo'){stopAll();var sh=$('#sheet');sh.hidden=true;sh.innerHTML='';sh.className='sheet';pickVenue(id);return}
    if(act==='venue'){pickVenue(id);return}
    if(act==='google'){doAuth();return}
    if(act==='signout'){closeSheet();if(unsubVenue){unsubVenue();unsubVenue=null}if(unsubEv){unsubEv();unsubEv=null}vid=null;cfg=null;myVenues=null;lsSet('dc-venue',null);store.signOut();return}
    if(act==='export'){exportVenue();return}
    if(act==='sharelink'){shareLink(id);return}
    if(act==='shareall'){shareAll();return}
    if(act==='crewadd'){var ni=$('#newcrew'),nn=((ni&&ni.value)||'').replace(/[~|]/g,'').trim().slice(0,24);if(!nn){ni&&ni.focus();return}cfg.crew=crewList().concat([{id:newId('c'),name:nn,posts:[]}]);saveCrew();openStations();setTimeout(function(){var q=$('#newcrew');q&&q.focus()},30);return}
    if(act==='crewrm'){var cm=crewList().filter(function(c){return c.id===b.dataset.c})[0];if(cm&&window.confirm('Remove '+cm.name+' from your staff list?')){cfg.crew=crewList().filter(function(c){return c.id!==b.dataset.c});saveCrew();openStations()}return}
    if(act==='crewtog'){var cw=crewList().filter(function(c){return c.id===b.dataset.c})[0];if(cw){var ps=(cw.posts||[]).filter(function(p){return p!==b.dataset.s});if(b.checked)ps.push(b.dataset.s);cw.posts=ps;saveCrew();var pq=document.querySelector('.pqr[data-c="'+b.dataset.c+'"]');if(pq)pq.innerHTML=pqr(cw);var sb=document.querySelector('[data-act="crewsend"][data-c="'+b.dataset.c+'"]');if(sb)sb.disabled=!crewLinks(cw).length;var wn2=document.querySelector('.warnnote');if(wn2){var hv={};crewList().forEach(function(c){(c.posts||[]).forEach(function(p){hv[p]=1})});var lo=stations(cfg).filter(function(x){return !hv[x.id]});wn2.hidden=!lo.length;wn2.textContent='Nobody is assigned to: '+lo.map(function(x){return x.label}).join(', ')}}return}
    if(act==='crewsend'){var cs=crewList().filter(function(c){return c.id===b.dataset.c})[0];if(cs&&crewLinks(cs).length)shareText(cfg.venue||'Door Count',personMsg(cs),null);return}
    if(act==='crewall'){var parts=crewList().filter(function(c){return crewLinks(c).length}).map(personMsg);if(parts.length)shareText(cfg.venue||'Door Count','Door Count staff links for '+(cfg.venue||'the venue')+'\n\n'+parts.join('\n\n----\n\n'),null);return}
    if(act==='qr'){qrOpen=(qrOpen===id?'':id);openStations();return}
    if(act==='tomgr'){location.href=location.pathname+'?v='+vid;return}
    if(act==='chvenue'){closeSheet();if(unsubVenue){unsubVenue();unsubVenue=null}if(unsubEv){unsubEv();unsubEv=null}vid=null;cfg=null;lsSet('dc-venue',null);lastHead='';sig='';render();return}
    if(act==='post'){if(canCfg){peek=id}else lsSet('dc-station-'+vid,id);lastHead='';sig='';closeSheet();render();return}
    if(act==='chpost'){if(canCfg)peek=null;else lsSet('dc-station-'+vid,null);lastHead='';sig='';render();return}
    if(act==='design'){openDesign();return}
    if(act==='stations'){openStations();return}
    if(act==='qrpage'){openQr();return}
    if(act==='takeover'){var tl=stations(cfg);openSheet('<h2>Count a post</h2><p class="note">Pick a post to count it yourself, for example to cover a bouncer on a break.</p><div class="qlist">'+tl.map(function(x){return '<button class="qrow kd-'+x.k+'" data-act="post" data-a="'+esc(x.id)+'"><em class="kt">'+(x.k==='path'?'Path':'Door')+'</em><b>'+esc(x.label)+'</b></button>'}).join('')+'</div><div class="acts"><button class="btn primary" data-act="close">Cancel</button></div>');return}
    if(act==='qrshow'){openQr(b.dataset.k,id);return}
    if(act==='night'){setTab('night');openNight();return}
    if(act==='hist'){setTab('hist');openHist();return}
    if(act==='csv'){saveCsv();return}
    if(act==='nn'){
      if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tap again to clear tonight';return}
      startNight();return;
    }
    if(!cfg)return;
    var m=compute(),g=1,tcap=+cfg.totalCap||0,area=areaOf(id);
    if(act==='go'){
      var gf=b.dataset.from,gt=b.dataset.to,ga=areaOf(gt);
      if(!canMove(gf,gt))return;
      if(m.counts[gf]<g){toast('Not enough people counted in '+nm(gf)+'.');return}
      if(ga&&+ga.cap&&m.counts[gt]+g>+ga.cap)toast(nm(gt)+' is over its limit. Recorded.');
      addEvent('move',gf,gt,g,{door:curDoor()});return;
    }
    if(act==='pswap'){
      var pp3=station==='all'?null:postInfo(station);
      if(curCtx&&curCtx.via)pp3={passage:(cfg.passages||[]).filter(function(x){return x.id===curCtx.via})[0]};
      if(!pp3||!pp3.passage)return;
      var sa=b.dataset.area;
      if(m.counts[sa]<g){toast('Only '+m.counts[sa]+' counted in '+nm(sa)+'.');return}
      doSwap(sa,{via:pp3.passage.id});return}
    if(act==='pass'){
      var pp2=station==='all'?null:postInfo(station);
      if(curCtx&&curCtx.via)pp2={passage:(cfg.passages||[]).filter(function(x){return x.id===curCtx.via})[0]};
      if(!pp2||!pp2.passage)return;
      var pf=b.dataset.from,pt2=b.dataset.to,pa2=areaOf(pt2);
      if(pf!=='out'&&m.counts[pf]<g){toast('Not enough people counted in '+nm(pf)+'.');return}
      if((pa2&&+pa2.cap&&m.counts[pt2]+g>+pa2.cap)||(pf==='out'&&tcap&&m.total+g>tcap))toast('Over the limit. Recorded.');
      if(pf==='out')addEvent('in',null,pt2,g,{via:pp2.passage.id});
      else if(pt2==='out')addEvent('out',pf,null,g,{via:pp2.passage.id});
      else addEvent('move',pf,pt2,g,{via:pp2.passage.id});
      return;
    }
    if(act==='fix'){openFix(id);return}
    if(act==='fix-save'){
      var tgt=parseInt($('#f-n').value,10);
      if(isNaN(tgt)||tgt<0){toast('Enter a number, 0 or more.');return}
      var dd=tgt-m.counts[id];
      if(dd)addEvent('adjust',null,id,dd,{note:($('#f-note').value||'').trim()});
      closeSheet();return;
    }
    if(act==='tally'){var pt=station==='all'?null:postInfo(station);addEvent('tally',null,pt&&pt.area?pt.area.id:null,g,{tag:b.dataset.tag,door:pt&&pt.door?pt.door.id:null});return}
    if(act==='in'&&area){
      var cap=+area.cap||0;
      if((cap&&m.counts[id]+g>cap)||(tcap&&m.total+g>tcap))toast('Over the limit. Recorded.');
      addEvent('in',null,id,g,{door:curDoor()});return;
    }
    if(act==='swap'&&area){
      if(m.counts[id]<g){toast('Only '+m.counts[id]+' counted in '+area.name+'.');return}
      doSwap(id,{door:curDoor()});return}
    if(act==='out'&&area){if(m.counts[id]<g){toast('Only '+m.counts[id]+' counted in '+area.name+'.');return}addEvent('out',id,null,g,{door:curDoor()});return}
    if(act==='edtog'){edMode=!edMode;paint();return}
    if(act==='help'){openHelp();return}
    if(act==='venuedel'){openVenueDel();return}
    if(act==='venuedelyes'){doVenueDel();return}
    if(act==='helpb'){openHelp(true);return}
    if(act==='edstart'){edMode=true;closeSheet();paint();return}
    if(act==='savename'){var inp=$('#ngin'),nv=((inp&&inp.value)||'').replace(/[~|]/g,'').trim().slice(0,24);if(!nv){inp&&inp.focus();return}lsSet('dc-name',nv);nameDraft='';paint();return}
    if(act==='myname'){nameDraft=myName();lsSet('dc-name',null);paint();return}
    if(act==='cvtoggle'){cvOpen=!cvOpen;paint();return}
    if(act==='view'){stnView=b.dataset.v==='room'?'room':'counts';try{localStorage.setItem('dcView',stnView)}catch(e){}paint();return}
    if(act==='undo'){
      var last=m.sorted.filter(function(e){return devOf(e.by)===uid}).pop();
      if(!last)return;
      var gone=[last];
      if(last.note==='swap'&&last.kind==='in'){var mine=m.sorted.filter(function(e){return devOf(e.by)===uid});var pv=mine[mine.length-2];if(pv&&pv.note==='swap'&&pv.kind==='out'&&Math.abs(last.ts-pv.ts)<10000)gone.push(pv)}
      events=events.filter(function(e){return !gone.some(function(g0){return g0.id===e.id})});paint();
      gone.forEach(function(g0){Promise.resolve(store.delEvent(vid,g0.id)).catch(function(){toast('Could not undo that tap.')})});
    }
  });

  function onWiz(ev){var t=ev.target;if(W&&t.dataset&&t.dataset.w)wInput(t)}
  document.addEventListener('change',onWiz);
  document.addEventListener('input',function(ev){onWiz(ev)});
  document.addEventListener('change',function(ev){if(ev.target.id==='imp'&&ev.target.files&&ev.target.files[0])importVenue(ev.target.files[0])});

  window.addEventListener('online',updatePill);
  window.addEventListener('offline',updatePill);
  setInterval(updatePill,8000);

  async function init(){
    soundOn=lsGet('dc-sound')!=='0';
    uid=lsGet('dc-dev');if(!uid){uid='d'+rid(10);lsSet('dc-dev',uid)}
    var qs=new URLSearchParams(location.search);urlV=qs.get('v');urlS=qs.get('s');urlP=qs.get('p');var wn=(qs.get('w')||'').replace(/[~|]/g,'').trim().slice(0,24);if(wn)lsSet('dc-name',wn);
    render();
    setTimeout(function(){slow=true;if(!cfgLoaded)render()},10000);
    try{store=window.__fakeStore||await makeFirebaseStore()}catch(e){store=null}
    if(!store){render();return}
    store.onUser(function(u){
      user=u;authReady=true;
      if(u&&!urlV)startMyVenues();
      if(!u&&!urlV){if(unsubMy){unsubMy();unsubMy=null}myVenues=null;if(vid){if(unsubVenue)unsubVenue();if(unsubEv)unsubEv();unsubVenue=unsubEv=null;vid=null;cfg=null}}
      render();
    });
    if(urlV)openVenue(urlV);
  }
  init();
})();
</script>
